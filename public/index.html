<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comic Watchman</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
      <span class="text-3xl">📚</span>
      <h1 class="text-xl font-bold tracking-tight text-yellow-400">Comic Watchman</h1>
      <span id="total-badge" class="ml-1 bg-gray-700 text-gray-300 text-xs px-2 py-0.5 rounded-full font-mono"></span>
      <div class="ml-auto flex items-center gap-2">
        <button id="btn-add"
          class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-semibold px-4 py-2 rounded-lg text-sm flex items-center gap-1 transition">
          <span class="text-lg leading-none">＋</span> Add Comic
        </button>
      </div>
    </div>
  </header>

  <!-- Stats bar -->
  <div id="stats-bar" class="bg-gray-900 border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-2 flex gap-6 text-sm">
      <span class="text-gray-400">Total: <strong id="stat-total" class="text-white">…</strong></span>
      <span class="text-green-400">Read: <strong id="stat-read">…</strong></span>
      <span class="text-blue-400">Reading: <strong id="stat-reading">…</strong></span>
      <span class="text-gray-400">Unread: <strong id="stat-unread">…</strong></span>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap gap-3 items-center">
    <input id="search" type="search" placeholder="Search title, series, notes…"
      class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yellow-400 w-64" />
    <select id="filter-status"
      class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
      <option value="">All Statuses</option>
      <option value="unread">Unread</option>
      <option value="reading">Reading</option>
      <option value="read">Read</option>
    </select>
    <select id="filter-publisher"
      class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
      <option value="">All Publishers</option>
    </select>
    <select id="filter-series"
      class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
      <option value="">All Series</option>
    </select>
    <button id="btn-clear-filters" class="text-xs text-gray-500 hover:text-yellow-400 transition underline ml-auto">
      Clear filters
    </button>
  </div>

  <!-- Comics grid -->
  <main class="max-w-7xl mx-auto px-4 pb-16">
    <div id="comics-grid" class="grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></div>
    <div id="empty-state" class="hidden flex-col items-center justify-center py-24 text-center">
      <div class="text-6xl mb-4">🗂️</div>
      <p class="text-gray-400 text-lg mb-2">No comics found</p>
      <p class="text-gray-600 text-sm">Add your first comic to start tracking your collection.</p>
    </div>
  </main>

  <!-- Modal backdrop -->
  <div id="modal-backdrop"
    class="hidden fixed inset-0 bg-black/70 z-40 flex items-center justify-center p-4">

    <!-- Modal -->
    <div id="modal"
      class="bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-6 pt-6 pb-2">
        <h2 id="modal-title" class="text-lg font-bold text-yellow-400">Add Comic</h2>
        <button id="modal-close" class="text-gray-500 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <form id="comic-form" class="px-6 pb-6 space-y-4 mt-2">
        <input type="hidden" id="form-id" />

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Title <span class="text-red-400">*</span></label>
          <input id="form-title" type="text" required placeholder="e.g. The Dark Knight Returns"
            class="form-input w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Series</label>
            <input id="form-series" type="text" placeholder="e.g. Batman"
              class="form-input w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Issue #</label>
            <input id="form-issue" type="text" placeholder="e.g. 1"
              class="form-input w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Publisher</label>
            <input id="form-publisher" type="text" placeholder="e.g. DC Comics"
              class="form-input w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Year</label>
            <input id="form-year" type="number" placeholder="e.g. 1986" min="1900" max="2100"
              class="form-input w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Status</label>
          <select id="form-status"
            class="form-input w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400">
            <option value="unread">Unread</option>
            <option value="reading">Reading</option>
            <option value="read">Read</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Cover Image URL</label>
          <input id="form-cover" type="url" placeholder="https://…"
            class="form-input w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Notes</label>
          <textarea id="form-notes" rows="3" placeholder="Optional notes…"
            class="form-input w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 resize-none"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="btn-delete-comic"
            class="hidden bg-red-700 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
            Delete
          </button>
          <button type="button" id="modal-cancel"
            class="bg-gray-700 hover:bg-gray-600 text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
            Cancel
          </button>
          <button type="submit"
            class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-semibold px-5 py-2 rounded-lg text-sm transition">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
